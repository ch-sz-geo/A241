
name: Pages Publish

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # [pull_request_target]
  push:
    branches: [ master, main ]
    paths:
      - 'docs/*'
      - 'themes/*'
      - 'docs/modelldokumentation/*'
      - 'docs/erfassungsrichtlinien/*'
      - 'docs/img/*'
      - 'index.html'
  pull_request:
    branches: [ master, main ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      pull-requests: write
      pages: write
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v3
      #- name: Setup Ruby
       # uses: ruby/setup-ruby@8575951200e472d5f2d95c625da0c7bec8217c42 # v1.161.0
        #with:
         # ruby-version: '3.1' # Not needed with a .ruby-version file
         # bundler-cache: true # runs 'bundle install' and caches installed gems automatically
         # cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2 # Stelle sicher, dass die Version kompatibel ist
      - name: Install Bundler
        run: gem install bundler
      - name: Add Ruby bin to PATH
        run: echo "$(ruby -e 'puts Gem.user_dir')/bin" >> $GITHUB_PATH
      - name: Install Gems with Bundler
        run: bundle install --path vendor/bundle
      - name: Verify Installation
        run: bundle exec asciidoctor --version
      - name: create file
        run: |
          bundle exec asciidoctor -o ./docs/modelldokumentation.html ./docs/modelldokumentation/modelldokumentation.adoc
          bundle exec asciidoctor -o ./docs/erfassungsrichtlinien.html ./docs/erfassungsrichtlinien/erfassungsrichtlinien.adoc
      - name: install Asciidoc Pdf
        run: gem install asciidoctor-pdf
      - name: create pdfs
        run: |
          asciidoctor-pdf --theme ./themes/pdfTheme.yml -o ./docs/modelldokumentation.pdf ./docs/modelldokumentation/modelldokumentation.adoc
          asciidoctor-pdf --theme ./themes/pdfTheme.yml -o ./docs/erfassungsrichtlinien.pdf ./docs/erfassungsrichtlinien/erfassungsrichtlinien.adoc
      - name: Commit HTML
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git diff-index --quiet HEAD || git commit -m "Generate HTML from AsciiDoc" && git push
